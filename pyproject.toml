[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mabus-mailroom"
version = "0.2.0"
description = "Mabus Mailroom: an MCP server that gives an AI agent access to several Gmail accounts at once: read-only by default, drafts and sending opt-in per account"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "cryptography>=43",
]

[project.urls]
Homepage = "https://mabus.ai/mabus-mailroom"
Source = "https://github.com/dpdanpittman/mabus-mailroom"
Privacy = "https://mabus.ai/mabus-mailroom/privacy"
Terms = "https://mabus.ai/mabus-mailroom/terms"

[project.scripts]
mabus-mailroom = "mabus_mailroom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mabus_mailroom"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.optional-dependencies]
pdf = ["pypdf>=5"]
test = ["pytest>=8", "pytest-asyncio>=0.24", "pypdf>=5"]
